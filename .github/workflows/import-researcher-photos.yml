name: Import existing ELSDR researcher portraits
on:
  push:
    paths:
      - .github/workflows/import-researcher-photos.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download original lab staff portrait files
        run: |
          python3 - <<'PY'
          import pathlib, urllib.request, time
          portraits = [
            ("researcher-1", "https://cdn.imweb.me/thumbnail/20220712/81a448922cb72.jpg"),
            ("researcher-2", "https://cdn.imweb.me/thumbnail/20220712/d569b84ea2deb.jpg"),
            ("researcher-3", "https://cdn.imweb.me/thumbnail/20260417/2f2a4723bbc84.png"),
            ("researcher-4", "https://cdn.imweb.me/thumbnail/20260907/f0a3e516e8bcc.jpg"),
            ("researcher-5", "https://cdn.imweb.me/thumbnail/20250826/16122c8b3de96.png"),
            ("researcher-6", "https://cdn.imweb.me/thumbnail/20210828/c338163145723.png"),
            ("researcher-7", "https://cdn.imweb.me/thumbnail/20250826/cf103da1e5f64.jpg"),
            ("researcher-8", "https://cdn.imweb.me/thumbnail/20230220/87fd117ffbe7e.jpg"),
            ("researcher-9", "https://cdn.imweb.me/thumbnail/20210828/44750b4d51491.jpg"),
            ("researcher-10", "https://cdn.imweb.me/thumbnail/20250826/ee3f9dd2f908f.jpg"),
            ("researcher-11", "https://cdn.imweb.me/thumbnail/20210828/81de827502d72.jpg"),
            ("researcher-14", "https://cdn.imweb.me/thumbnail/20220727/99a81f6a38258.jpg"),
            ("researcher-15", "https://cdn.imweb.me/thumbnail/20250826/2a85815b97070.jpg"),
            ("researcher-intern-kim-hun-po", "https://cdn.imweb.me/thumbnail/20261106/3721b1ec33cfa.jpg"),
            ("researcher-intern-kim-cheon-ju", "https://cdn.imweb.me/thumbnail/20261106/a5a3a27e1e6e6.png"),
          ]
          dest = pathlib.Path("assets/people/researchers")
          dest.mkdir(parents=True, exist_ok=True)
          failures = []
          for name, url in portraits:
              suffix = pathlib.Path(url.split("?")[0]).suffix.lower()
              if suffix not in (".jpg", ".png"): raise ValueError("Unexpected file extension")
              output = dest / (name + suffix)
              if output.exists(): continue
              try:
                  request = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0 (ELSDR website migration)"})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      binary = response.read()
                  if len(binary) < 1000 or not (binary.startswith(b"\xff\xd8\xff") or binary.startswith(b"\x89PNG")):
                      raise ValueError("Invalid image payload")
                  output.write_bytes(binary)
                  print("Imported", output, len(binary), "bytes")
              except Exception as error:
                  print("FAILED", name, error)
                  failures.append(name)
              time.sleep(.2)
          if failures: raise RuntimeError("Missing photos: " + ", ".join(failures))
          PY
      - name: Commit imported original portraits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/people/researchers
          if ! git diff --cached --quiet; then
            git commit -m "Store migrated ELSDR researcher portraits in repository"
            git push origin HEAD:main
          fi
