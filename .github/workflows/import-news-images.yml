name: Import ELSDR News image assets
on:
  push:
    paths:
      - .github/workflows/import-news-images.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified original News images
        run: |
          python3 - <<'PY'
          import pathlib, urllib.request, time
          images = [
            ("news-2026-tae-grant", "https://cdn.imweb.me/upload/S2021072113663b21de5af/66dbac8ed0036.png"),
            ("news-2026-book-talk", "https://cdn.imweb.me/upload/S2021072113663b21de5af/2a9382c886bfd.png"),
            ("news-2023-resilience-book-seminar", "https://cdn.imweb.me/upload/S2021072113663b21de5af/5514237501e3e.png"),
            ("news-2022-routledge", "https://cdn.imweb.me/upload/S2021072113663b21de5af/d79f3722b3a30.png"),
          ]
          directory = pathlib.Path("assets/life/news")
          directory.mkdir(parents=True, exist_ok=True)
          failed = []
          for name,url in images:
              ext=pathlib.Path(url).suffix.lower()
              if ext not in (".jpg",".png"): raise ValueError("Image type not supported")
              path=directory/(name+ext)
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
                  with urllib.request.urlopen(req,timeout=30) as response: payload=response.read()
                  if len(payload)<1000 or not (payload.startswith(b"\xff\xd8\xff") or payload.startswith(b"\x89PNG")):
                      raise ValueError("Unexpected image response")
                  path.write_bytes(payload)
                  print("Imported",path,len(payload))
              except Exception as exc:
                  failed.append(f"{name}: {exc}")
              time.sleep(.3)
          if failed: raise RuntimeError("Cannot import images: "+", ".join(failed))
          PY
      - name: Commit original News images to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/life/news
          if ! git diff --cached --quiet; then
            git commit -m "Store verified ELSDR News image assets"
            git push origin HEAD:main
          fi
