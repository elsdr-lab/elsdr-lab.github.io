name: Import verified ELSDR event cover photos
on:
  push:
    paths:
      - .github/workflows/import-event-covers.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy verified gallery cover files
        run: |
          python -m pip -q install requests Pillow
          python - <<'PY'
          import json,pathlib,requests,io,time
          from PIL import Image,ImageOps
          root=pathlib.Path(".")
          audit=json.loads((root/"assets/life/events/match-audit.json").read_text(encoding="utf-8"))
          source=(root/"life-records.js").read_text(encoding="utf-8")
          mark="window.ELSDR_LIFE_RECORDS="
          head,tail=source.split(mark,1)
          records=json.loads(tail.strip().rstrip(";"))
          gallery={x["title"]:x for x in audit["gallery"]}
          selected={x["id"]:x["choices"][0] for x in audit["matches"] if x["confident"]}
          for name,title in [("hld-lecture-2025","2025 HLD 특강"),("archive-2018-044","해양생태융복합 2030 워크숍")]:
              if title in gallery: selected[name]=gallery[title]
          dest=root/"assets/life/events/photos"
          dest.mkdir(parents=True,exist_ok=True)
          session=requests.Session()
          session.headers.update({"User-Agent":"Mozilla/5.0"})
          completed,errors=[],[]
          for e in records["events"]:
              e.setdefault("photo","")
              ref=selected.get(e["id"])
              if not ref:continue
              target=dest/(e["id"]+".jpg")
              urls=[]
              original=ref.get("image","")
              if original.startswith("S202") or original.startswith("S20"):
                  urls.append("https://cdn.imweb.me/upload/"+original)
              thumbnail=ref.get("thumb","")
              if thumbnail.startswith("https://cdn.imweb.me/"):
                  urls.append(thumbnail)
              problem=None
              for url in urls:
                  try:
                      response=session.get(url,timeout=28)
                      response.raise_for_status()
                      if len(response.content)>15000000:raise ValueError("Photo too large")
                      image=Image.open(io.BytesIO(response.content))
                      image=ImageOps.exif_transpose(image)
                      if image.width<200 or image.height<150:raise ValueError("Photo too small")
                      if image.mode in ("RGBA","LA") or ("transparency" in image.info):
                          b=Image.new("RGB",image.size,"white")
                          b.paste(image,mask=image.convert("RGBA").getchannel("A"))
                          image=b
                      else:image=image.convert("RGB")
                      image.thumbnail((1800,1800),Image.Resampling.LANCZOS)
                      image.save(target,"JPEG",quality=88,optimize=True,subsampling=0)
                      e["photo"]="assets/life/events/photos/"+target.name
                      e["photoSourceUrl"]="https://edesign.korea.ac.kr"+ref["href"] if ref.get("href","").startswith("/") else ""
                      if e.get("sourceUrl","").rstrip("/")=="https://edesign.korea.ac.kr/36" and e["photoSourceUrl"]:
                          e["sourceUrl"]=e["photoSourceUrl"]
                      completed.append((e["id"],target.stat().st_size))
                      break
                  except Exception as exc:
                      problem=str(exc)
              if not e["photo"]:errors.append((e["id"],problem or "no URL"))
              time.sleep(.12)
          (root/"life-records.js").write_text(head+mark+json.dumps(records,ensure_ascii=False,indent=2)+";\n",encoding="utf-8")
          (root/"assets/life/events/photo-import-report.json").write_text(json.dumps({"imported":completed,"failed":errors,"matched":len(selected)},ensure_ascii=False,indent=2),encoding="utf-8")
          print("PHOTOS IMPORTED",len(completed),"FAILED",len(errors),"TOTAL BYTES",sum(size for _,size in completed))
          print("FAILED",errors)
          PY
      - name: Commit verified photos and updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/life/events/photos assets/life/events/photo-import-report.json life-records.js
          if ! git diff --cached --quiet; then
            git commit -m "Migrate original verified event gallery photographs into Events details"
            git push origin HEAD:main
          fi
