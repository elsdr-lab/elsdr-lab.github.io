name: Import two Korean book covers
on:
  push:
    branches: [content/correct-book-list-20261111]
    paths: [.github/workflows/import-korean-book-covers.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import covers
        run: |
          mkdir -p assets/people/books
          curl -fL --retry 2 --max-time 35 'https://image.yes24.com/goods/3863802/XL' -o assets/people/books/urban-forest-theory.jpg
          curl -fL --retry 2 --max-time 35 'https://image.yes24.com/goods/137204347/XL' -o assets/people/books/world-urban-forests.jpg
          for f in assets/people/books/urban-forest-theory.jpg assets/people/books/world-urban-forests.jpg; do
            file "$f" | grep -qi 'JPEG image'
            test "$(wc -c < "$f")" -gt 5000
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/people/books/urban-forest-theory.jpg assets/people/books/world-urban-forests.jpg
          git commit -m "Save two Korean urban forest book covers"
          git push origin HEAD:content/correct-book-list-20261111
