name: Match historic ELSDR Event photographs
on:
  push:
    paths:
      - .github/workflows/match-event-photos.yml
permissions:
  contents: write
jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit exact original gallery captions
        run: |
          python -m pip -q install beautifulsoup4 requests
          python - <<'PY'
          import requests,bs4,re,json,pathlib,unicodedata,difflib
          text=pathlib.Path('life-records.js').read_text()
          data=json.loads(text.split('window.ELSDR_LIFE_RECORDS=',1)[1].strip().rstrip(';'))
          session=requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0 Safari/537.36'})
          response=session.get('https://edesign.korea.ac.kr/36',timeout=35)
          print('HTTP',response.status_code,'HTML LENGTH',len(response.content))
          soup=bs4.BeautifulSoup(response.text,'html.parser')
          print('GALLERY ANCHORS',len(soup.select('a.item_container[href]')),'GALLERY DIVS',len(soup.select('div.item_gallary')),'BODY START',soup.get_text(' ',strip=True)[:180])
          albums=[]
          for a in soup.select('a.item_container[href]'):
            block=a.find_parent('div',class_='item_gallary')
            if not block:continue
            caption=block.select_one('h4')
            label=caption.get_text(' ',strip=True) if caption else a.get_text(' ',strip=True)
            href=a.get('href','')
            image=block.get('data-org','')
            display=a.select_one('.img_wrap')
            thumb=display.get('data-src','') if display else ''
            if not image and not thumb:continue
            albums.append({'title':label,'href':href,'image':image,'thumb':thumb})
          def norm(s):
            s=unicodedata.normalize('NFKC',s).lower()
            s=re.sub(r'[^가-힣a-z0-9]+','',s)
            return s
          matches=[]
          for e in data['events']:
            candidates=[]
            for entry in albums:
              score=difflib.SequenceMatcher(None,norm(e['title']),norm(entry['title'])).ratio()
              ey=re.search(r'20\d{2}',e['title'])
              ay=re.search(r'20\d{2}',entry['title'])
              if ay and int(ay.group())!=int(e['year']):continue
              if score>=0.7:
                candidates.append({**entry,'score':round(score,3)})
            candidates.sort(key=lambda x:x['score'],reverse=True)
            first=candidates[0] if candidates else None
            confident=bool(first and first['score']>=.88 and (len(candidates)==1 or first['score']-candidates[1]['score']>.04))
            matches.append({'id':e['id'],'title':e['title'],'year':e['year'],'confident':confident,'choices':candidates[:3]})
          report={'albumCount':len(albums),'eventCount':len(matches),'matched':sum(x['confident'] for x in matches),'matches':matches,'gallery':albums}
          dest=pathlib.Path('assets/life/events/match-audit.json')
          dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print('MATCH SUMMARY',report['albumCount'],report['matched'],report['eventCount'])
          PY
      - name: Commit match audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/life/events/match-audit.json
          git commit -m "Match historic event captions to original gallery image assets" || true
          git push origin HEAD:main
