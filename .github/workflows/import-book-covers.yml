name: Import book covers
on:
  push:
    branches: [content/professor-books-20261111]
    paths: [.github/workflows/import-book-covers.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import published cover images
        run: |
          mkdir -p assets/people/books
          curl -fL --retry 2 --max-time 35 -A 'Mozilla/5.0' 'https://image.yes24.com/goods/167576944/XL' -o 'assets/people/books/landscape-nearby.jpg'
          file 'assets/people/books/landscape-nearby.jpg' | grep -qi 'JPEG image'
          curl -fL --retry 2 --max-time 35 -A 'Mozilla/5.0' 'https://image.yes24.com/goods/125133531/XL' -o 'assets/people/books/landscape-planning.jpg'
          file 'assets/people/books/landscape-planning.jpg' | grep -qi 'JPEG image'
          curl -fL --retry 2 --max-time 35 -A 'Mozilla/5.0' 'https://kupress.com/wp-content/uploads/%ED%9A%8C%EB%B3%B5%EB%A0%A5%EC%9D%98-%EC%9B%90%EC%B9%99_550.jpg' -o 'assets/people/books/resilience-principles.jpg'
          file 'assets/people/books/resilience-principles.jpg' | grep -qi 'JPEG image'
          curl -fL --retry 2 --max-time 35 -A 'Mozilla/5.0' 'https://image.yes24.com/goods/97697233/XL' -o 'assets/people/books/korean-landscape-horizons.jpg'
          file 'assets/people/books/korean-landscape-horizons.jpg' | grep -qi 'JPEG image'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/people/books
          git commit -m "Store verified published book cover images"
          git push origin HEAD:content/professor-books-20261111
