name: Import two academic book covers
on:
  push:
    branches: [content/professor-books-20261111]
    paths: [.github/workflows/import-additional-book-covers.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Save book covers
        run: |
          mkdir -p assets/people/books
          download_cover () {
            local out="$1"; shift
            for url in "$@"; do
              if curl -fL --retry 1 --max-time 20 -A 'Mozilla/5.0' "$url" -o "$out" && file "$out" | grep -qi 'JPEG image' && test "$(wc -c < "$out")" -gt 5000; then
                echo "Saved $out from $url"; return 0
              fi
            done
            rm -f "$out"; return 1
          }
          download_cover assets/people/books/forest-connectivity.jpg 'https://media.springernature.com/full/springer-static/cover-hires/book/978-3-031-82206-3' 'https://mediacdn.nhbs.com/jackets/jackets_resizer_xlarge/26/266432.jpg'
          download_cover assets/people/books/pacific-rim-handbook.jpg 'https://images.tandf.co.uk/common/jackets/amazon/978036747/9780367471149.jpg' 'https://images.tandf.co.uk/common/jackets/amazon/978103218/9781032189949.jpg' 'https://covers.openlibrary.org/b/isbn/9780367471149-L.jpg?default=false'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/people/books
          git commit -m "Store two academic book cover images"
          git push origin HEAD:content/professor-books-20261111
