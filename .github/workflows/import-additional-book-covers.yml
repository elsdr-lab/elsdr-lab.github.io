name: Import two academic book covers
on:
  push:
    branches: [content/professor-books-20261111]
    paths: [.github/workflows/import-additional-book-covers.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Save book covers
        run: |
          mkdir -p assets/people/books
          python - <<'PY'
          import urllib.request, io
          from PIL import Image
          sources = {
              "forest-connectivity": [
                  "https://media.springernature.com/full/springer-static/cover-hires/book/978-3-031-82206-3",
                  "https://mediacdn.nhbs.com/jackets/jackets_resizer_xlarge/26/266432.jpg"
              ],
              "pacific-rim-handbook": [
                  "https://images.tandf.co.uk/common/jackets/amazon/978036747/9780367471149.jpg",
                  "https://images.tandf.co.uk/common/jackets/amazon/978103218/9781032189949.jpg",
                  "https://covers.openlibrary.org/b/isbn/9780367471149-L.jpg?default=false"
              ]
          }
          for name, urls in sources.items():
              for url in urls:
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
                      with urllib.request.urlopen(req,timeout=20) as r: raw=r.read(8000000)
                      im=Image.open(io.BytesIO(raw)).convert("RGB")
                      if im.width<150 or im.height<200 or im.height<=im.width: raise ValueError("not a portrait cover")
                      im.save("assets/people/books/"+name+".jpg",quality=92)
                      print(name, url, im.size)
                      break
                  except Exception as e: print("failed",url,str(e))
              else: raise RuntimeError("No valid cover for "+name)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/people/books
          git commit -m "Store two academic book cover images"
          git push origin HEAD:content/professor-books-20261111
